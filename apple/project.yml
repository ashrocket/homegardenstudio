name: HomeGardenStudio
options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: 6P24N3R4TP
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    PRODUCT_BUNDLE_IDENTIFIER: com.ashleyraiteri.homegardenstudio
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_HARDENED_RUNTIME: YES
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    HGS_PRODUCTION_GATEWAY_URL: ""
    HGS_SANDBOX_GATEWAY_URL: ""
targets:
  HomeGardenStudio:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [HomeGardenStudio]
    info:
      path: Configuration/Info.plist
      properties:
        CFBundleDisplayName: Home Garden Studio
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: NO
        HGSKeychainAccessGroup: "$(AppIdentifierPrefix)com.ashleyraiteri.homegardenstudio"
        HGSProductionGatewayURL: "$(HGS_PRODUCTION_GATEWAY_URL)"
        HGSSandboxGatewayURL: "$(HGS_SANDBOX_GATEWAY_URL)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: YES
        LSApplicationCategoryType: public.app-category.lifestyle
        UISupportsDocumentBrowser: YES
        LSSupportsOpeningDocumentsInPlace: YES
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Home Garden Studio Plan
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.ashleyraiteri.homegardenstudio.plan]
            LSTypeIsPackage: YES
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.ashleyraiteri.homegardenstudio.plan
            UTTypeDescription: Home Garden Studio Plan
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [hgsplan]
          - UTTypeIdentifier: com.ashleyraiteri.homegardenstudio.feature
            UTTypeDescription: Garden feature
            UTTypeConformsTo: [public.data]
    settings:
      base:
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Configuration/macOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": Configuration/iOS.entitlements
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - framework: Frameworks/HgsCore.xcframework
        embed: false
  HomeGardenStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources: [HomeGardenStudioTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ashleyraiteri.homegardenstudio.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HomeGardenStudio.app/Contents/MacOS/HomeGardenStudio"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - target: HomeGardenStudio
  HomeGardenStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HomeGardenStudioUITests
        optional: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ashleyraiteri.homegardenstudio.uitests
        TEST_TARGET_NAME: HomeGardenStudio
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - target: HomeGardenStudio
  HomeGardenStudioApple:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: HomeGardenStudio
        excludes:
          - Cloud
          - Billing
          - Rendering
          - AI/LoopbackAssistant.swift
          - Views/AccountSheet.swift
          - Views/CloudRenderSheet.swift
          - Views/RenderPresentationScope.swift
          - Views/SponsorshipSheet.swift
          - PrivacyInfo.xcprivacy
      - path: AppleOnly/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Configuration/AppleOnly-Info.plist
      properties:
        CFBundleDisplayName: Home Garden Studio Apple
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: NO
        HGSAppleOnly: YES
        LSApplicationCategoryType: public.app-category.lifestyle
        UISupportsDocumentBrowser: YES
        LSSupportsOpeningDocumentsInPlace: YES
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Home Garden Studio Plan
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.ashleyraiteri.homegardenstudio.plan]
            LSTypeIsPackage: YES
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.ashleyraiteri.homegardenstudio.plan
            UTTypeDescription: Home Garden Studio Plan
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [hgsplan]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.ashleyraiteri.homegardenstudio.feature
            UTTypeDescription: Garden feature
            UTTypeConformsTo: [public.data]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashleyraiteri.homegardenstudio.appleonly
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HGS_APPLE_ONLY"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Configuration/AppleOnly-macOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": Configuration/AppleOnly-iOS.entitlements
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - framework: Frameworks/HgsCore.xcframework
        embed: false
  HomeGardenStudioAppleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HomeGardenStudioAppleTests
        optional: true
      - path: HomeGardenStudioTests/AppleConceptImageTests.swift
        optional: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ashleyraiteri.homegardenstudio.appleonly.tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HGS_APPLE_ONLY"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HomeGardenStudioApple.app/Contents/MacOS/HomeGardenStudioApple"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - target: HomeGardenStudioApple
schemes:
  HomeGardenStudio:
    build:
      targets:
        HomeGardenStudio: all
        HomeGardenStudioTests: [test]
    test:
      targets: [HomeGardenStudioTests]
  HomeGardenStudioUIQA:
    build:
      targets:
        HomeGardenStudio: all
        HomeGardenStudioUITests: [test]
    test:
      targets: [HomeGardenStudioUITests]
  HomeGardenStudioApple:
    build:
      targets:
        HomeGardenStudioApple: all
        HomeGardenStudioAppleTests: [test]
    test:
      targets: [HomeGardenStudioAppleTests]
